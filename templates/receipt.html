{% extends "base.html" %}
{% block title %}Receipt - Order #{{ order.order_id }}{% endblock %}
{% block content %}

<a href="{{ url_for('index') }}" style="color:var(--muted);text-decoration:none;font-size:13px;">&larr; Back to dashboard</a>

<div class="card" style="margin-top:12px;max-width:420px;">
  <pre style="background:#f5efe0;color:#2a2721;padding:18px;border-radius:6px;font-size:13px;line-height:1.5;overflow-x:auto;">{{ receipt_text }}</pre>
  <a class="btn" href="{{ url_for('download_receipt', order_id=order.order_id) }}" style="margin-top:12px;display:inline-block;">⬇ Download Receipt</a>
</div>

{% endblock %}
